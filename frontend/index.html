<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian Vault</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="header-inner">
          <div class="brand-logo">Obsidian <span>Vault</span></div>
          <div class="header-balance" id="balance-container" aria-live="polite">
            <span class="balance-label">Баланс:</span>
            <span class="balance-value" id="balance-value">—</span>
          </div>
        </div>
      </header>

      <main class="app-main" id="screen-root">
        <section class="obsidian-container" aria-labelledby="screen-title">
          <h1 id="screen-title">Слоты</h1>
          <p id="screen-description">
            Основной игровой зал Obsidian Vault. Выберите раздел в нижней панели навигации.
          </p>
          <div class="status-badge">Экран: Слоты</div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Основная навигация">
        <div class="bottom-nav-inner">
          <button type="button" class="nav-item is-active" data-section="slots" aria-current="page">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <line x1="9" y1="5" x2="9" y2="19"></line>
              <line x1="15" y1="5" x2="15" y2="19"></line>
            </svg>
            <span>Слоты</span>
          </button>

          <button type="button" class="nav-item" data-section="leaderboard">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 20V10"></path>
              <path d="M12 20V4"></path>
              <path d="M6 20v-6"></path>
            </svg>
            <span>Топ</span>
          </button>

          <button type="button" class="nav-item" data-section="inventory">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <span>Инвентарь</span>
          </button>

          <button type="button" class="nav-item" data-section="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Настройки</span>
          </button>
        </div>
      </nav>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
