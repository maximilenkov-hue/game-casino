<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidian Vault — Виртуальные слоты</title>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Верхняя панель: бренд и баланс -->
    <header id="app-header" class="app-header">
      <div class="brand">
        <span class="brand-emblem" aria-hidden="true">&#9830;</span>
        <span class="brand-title">OBSIDIAN VAULT</span>
      </div>

      <div id="balance-widget" class="balance-widget" aria-live="polite">
        <span class="balance-label">Баланс</span>
        <div class="balance-value-wrap">
          <span class="coin-symbol" aria-hidden="true">&#9672;</span>
          <span id="balance-amount" class="balance-amount">---</span>
        </div>
      </div>
    </header>

    <!-- Контейнер уведомлений -->
    <div id="notification-container" class="notification-container" role="status" aria-live="polite"></div>

    <!-- Центральная область активного экрана -->
    <main id="app-main" class="app-main" tabindex="-1">
      <div class="screen-state">
        <div class="spinner" aria-hidden="true"></div>
        <p>Загрузка игрового интерфейса...</p>
      </div>
    </main>

    <!-- Постоянное нижнее меню (4 раздела) -->
    <nav id="app-nav" class="app-nav" aria-label="Основная навигация">
      <button type="button" class="nav-item is-active" data-page="slots" aria-current="page">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <line x1="9" y1="4" x2="9" y2="20" />
          <line x1="15" y1="4" x2="15" y2="20" />
          <circle cx="6" cy="12" r="1" fill="currentColor" />
          <circle cx="12" cy="12" r="1" fill="currentColor" />
          <circle cx="18" cy="12" r="1" fill="currentColor" />
        </svg>
        <span class="nav-label">Слоты</span>
      </button>

      <button type="button" class="nav-item" data-page="leaderboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 21h8" />
          <path d="M12 17v4" />
          <path d="M7 4h10v6a5 5 0 0 1-10 0V4z" />
          <path d="M5 6H4a2 2 0 0 0 0 4h1" />
          <path d="M19 6h1a2 2 0 0 1 0 4h-1" />
        </svg>
        <span class="nav-label">Топ</span>
      </button>

      <button type="button" class="nav-item" data-page="inventory">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
          <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
          <line x1="12" y1="22.08" x2="12" y2="12" />
        </svg>
        <span class="nav-label">Инвентарь</span>
      </button>

      <button type="button" class="nav-item" data-page="settings">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span class="nav-label">Настройки</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
